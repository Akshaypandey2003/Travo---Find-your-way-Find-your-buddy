# Feedback Service - application-docker.yaml
server:
  port: ${SERVER_PORT:8093}

spring:
  application:
    name: feedback-service

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://mongodb:27017/Feedbacks}
      database: Feedbacks

  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://config-server:8086}

  cloud:
    config:
      failFast: false
      retry:
       maxAttempts: 6
       initialInterval: 2000
       multiplier: 1.5

  security:
   user:
    name: ${APP_BASIC_AUTH_USER}
    password: ${APP_BASIC_AUTH_PASSWORD}


  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

eureka:
  client:
    serviceUrl:
      defaultZone: http://service-registry:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 5
    instances:
      feedbackNotificationCircuitBreaker:
        baseConfig: default
      feedbackEventCircuitBreaker:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
    instances:
      feedbackNotificationRetry:
        baseConfig: default
      feedbackEventRetry:
        baseConfig: default

feedback:
  companion:
    max-peer-reviews-per-trip: ${FEEDBACK_MAX_PEER_REVIEWS_PER_TRIP:3}
  pagination:
    max-page-size: ${FEEDBACK_MAX_PAGE_SIZE:100}
  outbox:
    retry:
      fixed-delay-ms: ${FEEDBACK_OUTBOX_RETRY_DELAY_MS:30000}
      batch-size: ${FEEDBACK_OUTBOX_RETRY_BATCH_SIZE:50}
      max-attempts: ${FEEDBACK_OUTBOX_RETRY_MAX_ATTEMPTS:10}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

