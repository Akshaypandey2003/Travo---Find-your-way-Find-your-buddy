# API Gateway - application-docker.yaml
server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: api-gateway

      # (routes kept in application.yml or config repo)
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://config-server:8086}
  
  cloud:
    config:
      failFast: false
      retry:
       maxAttempts: 6
       initialInterval: 2000
       multiplier: 1.5

eureka:
  client:
    serviceUrl:
      defaultZone: http://service-registry:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

okta:
  oauth2:
    issuer: ${OKTA_ISSUER}
    audience: ${OKTA_AUDIENCE}
    client-id: ${OKTA_CLIENT_ID}
    client-secret: ${OKTA_CLIENT_SECRET}
