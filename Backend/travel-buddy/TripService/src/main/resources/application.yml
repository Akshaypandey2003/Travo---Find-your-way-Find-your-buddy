
server:
  port: ${PORT:8090}

spring:
  application:
    name: trip-service
  data:
    mongodb:
      database: Trips
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  cache:
    type: redis
    redis:
      time-to-live: 15m
      cache-null-values: false
      
  config:
    import: optional:configserver:http://localhost:8086
  
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: trip-service
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
kafka:
  topic:
    user-events: ${USER_EVENTS_TOPIC:user-events}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 5
    instances:
      tripNotificationCircuitBreaker:
        baseConfig: default
      tripDomainEventCircuitBreaker:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
    instances:
      tripNotificationRetry:
        baseConfig: default
      tripDomainEventRetry:
        baseConfig: default

trip:
  pagination:
    max-page-size: 100
  security:
    cors:
      allowed-origins: ${TRIP_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  reminder:
    batch-size: 200
    cron: "0 0 10 * * ?"
    zone: Asia/Kolkata
  notifications:
    retry:
      fixed-delay-ms: 30000
      batch-size: 50
      max-attempts: 10

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
