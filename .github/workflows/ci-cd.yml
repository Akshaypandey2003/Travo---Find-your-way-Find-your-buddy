name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Build backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Backend/travel-buddy/**/pom.xml

      - name: Build and verify backend
        run: mvn --batch-mode --no-transfer-progress -f Backend/travel-buddy/pom.xml verify

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Travo-Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Travo-Frontend
        run: npm ci

      - name: Build frontend
        working-directory: Travo-Frontend
        run: npm run build
