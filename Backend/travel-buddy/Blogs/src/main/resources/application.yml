server:
  port: ${PORT:8089}

spring:
  application:
    name: blog-service
  data:
    mongodb:
      database: Blogs

  config:
    import: optional:configserver:http://localhost:8086
  
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: blog-service
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
kafka:
  topic:
    user-events: ${USER_EVENTS_TOPIC:user-events}


resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 5
    instances:
      blogNotificationCircuitBreaker:
        baseConfig: default
      blogDomainEventCircuitBreaker:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
    instances:
      blogNotificationRetry:
        baseConfig: default
      blogDomainEventRetry:
        baseConfig: default

blog:
  pagination:
    max-page-size: 100
  security:
    cors:
      allowed-origins: ${BLOG_ALLOWED_ORIGINS:http://localhost:3000}
  notifications:
    retry:
      fixed-delay-ms: 30000
      batch-size: 50
      max-attempts: 10

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

cloudinary:
  cloud:
    name: ${CLOUDINARY_CLOUD_NAME}
  api:
    key: ${CLOUDINARY_API_KEY}
    secret: ${CLOUDINARY_API_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
