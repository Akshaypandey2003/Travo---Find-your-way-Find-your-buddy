server:
  port: ${PORT:8096}

spring:
  application:
    name: user-feed-service
  data:
    mongodb:
      database: UserFeed
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  cache:
    type: redis
    redis:
      time-to-live: 15m
      cache-null-values: false
  config:
    import: optional:configserver:http://localhost:8086
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: user-feed-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.events.*
        spring.json.use.type.headers: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  kafka:
    topics:
      post-events: ${POST_EVENTS_TOPIC:post-events}
      connection-events: ${CONNECTION_EVENTS_TOPIC:connection-events}
      user-events: ${USER_EVENTS_TOPIC:user-events}

user:
  service:
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:8080}

blog:
  service:
    base-url: ${BLOG_SERVICE_BASE_URL:http://localhost:8089}

feed:
  redis:
    latest-size: 20
    latest-ttl-minutes: 30
  connections:
    cache-ttl-minutes: 10
  dedupe:
    ttl-hours: 24
  security:
    cors:
      allowed-origins: ${FEED_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

jwt:
  secret: ${JWT_SECRET:change-me-dev-secret}
  expiration: ${JWT_EXPIRATION:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
