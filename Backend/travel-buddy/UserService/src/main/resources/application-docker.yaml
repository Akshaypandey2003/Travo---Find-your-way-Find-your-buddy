# User Service - application-docker.yaml
server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: user-service

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://mongodb:27017/Users}
      database: Users

  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://config-server:8086}

  cloud:
    config:
      failFast: false
      retry:
        maxAttempts: 6
        initialInterval: 2000
        multiplier: 1.5

  security:
   user:
    name: ${APP_BASIC_AUTH_USER}
    password: ${APP_BASIC_AUTH_PASSWORD}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

eureka:
  client:
    serviceUrl:
      defaultZone: http://service-registry:8761/eureka/
    register-with-eureka: true
    fetch-registry: true


okta:
  oauth2:
    issuer: ${OKTA_ISSUER}
    audience: ${OKTA_AUDIENCE}
