server:
  port: ${PORT:8095}

spring:
  application:
    name: notification-service
  config:
    import: optional:configserver:http://localhost:8086
  kafka:
    consumer:
      group-id: notification-service
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    org.springframework.kafka: DEBUG
