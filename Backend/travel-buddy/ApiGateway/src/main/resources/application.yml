server:
  port: ${PORT:8085}

spring:  
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://localhost:8086
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  cloud:
    gateway:
      routes:

      - id: USER-SERVICE-SECURED
        uri: lb://user-service
        predicates:
        - Path=/api/v1/users/**,/api/v1/connections,/api/v1/connections/**
        filters:
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service

            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                "[redis-rate-limiter.replenishRate]": 10
                "[redis-rate-limiter.burstCapacity]": 20

      - id: USER-SERVICE-PUBLIC
        uri: lb://user-service
        predicates:
        - Path=/api/v1/auth/**,/user/public/**
        filters:
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service

            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                "[redis-rate-limiter.replenishRate]": 10
                "[redis-rate-limiter.burstCapacity]": 20
        
      
      - id: TRIPS-SERVICE
        uri: lb://trip-service
        predicates:
        - Path=/api/v1/trips,/api/v1/trips/**
        filters:
            - name: CircuitBreaker
              args:
                name: tripServiceCircuitBreaker
                fallbackUri: forward:/fallback/trip-service

            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                "[redis-rate-limiter.replenishRate]": 10
                "[redis-rate-limiter.burstCapacity]": 20

      - id: FEEDBACK-SERVICE
        uri: lb://feedback-service
        predicates:
        - Path=/feedback/**
        filters:
            - name: CircuitBreaker
              args:
                name: feedbackServiceCircuitBreaker
                fallbackUri: forward:/fallback/feedback-service

            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                "[redis-rate-limiter.replenishRate]": 10
                "[redis-rate-limiter.burstCapacity]": 20

      - id: CHATS-SERVICE
        uri: lb://chat-service
        predicates:
        - Path=/chat/**,/chat/message/**
        filters:
            - name: CircuitBreaker
              args:
                name: chatServiceCircuitBreaker
                fallbackUri: forward:/fallback/chat-service

            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                "[redis-rate-limiter.replenishRate]": 10
                "[redis-rate-limiter.burstCapacity]": 20

      - id: BLOGS-SERVICE
        uri: lb://blog-service
        predicates:
        - Path=/blog/**,/comment/**
        filters:
            - name: CircuitBreaker
              args:
                name: blogServiceCircuitBreaker
                fallbackUri: forward:/fallback/blog-service

            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                "[redis-rate-limiter.replenishRate]": 10
                "[redis-rate-limiter.burstCapacity]": 20

      - id: NOTIFICATION-SERVICE
        uri: lb://notification-service
        predicates:
          - Path=/ws/**,/api/v1/notification,/api/v1/notification/**
        filters:
            - name: CircuitBreaker
              args:
                name: notificationServiceCircuitBreaker
                fallbackUri: forward:/fallback/notification-service

            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                "[redis-rate-limiter.replenishRate]": 10
                "[redis-rate-limiter.burstCapacity]": 20
      
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
 

# Resilience4j Circuit Breaker
resilience4j:

  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 5

    instances:
      userServiceCircuitBreaker:
        baseConfig: default
      tripServiceCircuitBreaker:
        baseConfig: default
      chatServiceCircuitBreaker:
        baseConfig: default
      blogServiceCircuitBreaker:
        baseConfig: default
      feedbackServiceCircuitBreaker:
        baseConfig: default
      notificationServiceCircuitBreaker:
        baseConfig: default


  timelimiter:
    configs:
      default:
        timeoutDuration: 5s

    instances:
      userServiceCircuitBreaker:
        baseConfig: default
      tripServiceCircuitBreaker:
        baseConfig: default
      chatServiceCircuitBreaker:
        baseConfig: default
      blogServiceCircuitBreaker:
        baseConfig: default
      feedbackServiceCircuitBreaker:
        baseConfig: default
      notificationServiceCircuitBreaker:
        baseConfig: default

logging:
  level:
    "[org.springframework.cloud.gateway]": INFO
    "[reactor.netty.http.client]": INFO


#JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

gateway:
  security:
    cors:
      allowed-origins: ${GATEWAY_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus


        
