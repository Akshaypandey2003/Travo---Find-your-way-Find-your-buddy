server:
  port: ${PORT:8080}



spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: Users
  application:
    name: USER-SERVICE
  security:
    user:
      name: admin
      password: password
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://config-server:8086}


# File size limit for multipart requests
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Okta Configuration
okta:
  oauth2:
    issuer: https://dev-95846997.okta.com/oauth2/default
    audience: api://default

#Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

jwt:
  secret: ${JWT_SECRET:my-super-secret-jwt-key-my-super-secret-jwt-key}
  expiration: ${JWT_EXPIRATION:3600000}