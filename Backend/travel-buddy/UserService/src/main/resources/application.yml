server:
  port: ${PORT:8080}

spring:
  application:
    name: user-service
  data:
    mongodb:
      database: Users
  config:
    import: optional:configserver:http://localhost:8086
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: false
    consumer:
      group-id: user-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.events.*
        spring.json.use.type.headers: true
logging:
  level:
    org.springframework.kafka: INFO


resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s

    instances:
      notificationServiceCircuitBreaker:
        baseConfig: default
      

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 2s
    instances:
      notificationServiceRetry:
        baseConfig: default

user:
  pagination:
    max-page-size: 100
  notifications:
    retry:
      fixed-delay-ms: 30000
      batch-size: 50
      max-attempts: 10
  security:
    cors:
      allowed-origins: ${USER_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:7200000}

cloudinary:
  cloud:
    name: ${CLOUDINARY_CLOUD_NAME}
  api:
    key: ${CLOUDINARY_API_KEY}
    secret: ${CLOUDINARY_API_SECRET}

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

